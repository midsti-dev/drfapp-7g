---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: default
  labels:
    app: celery-beat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-beat
  template:
    metadata:
      labels:
        app: celery-beat
    spec:
      containers:
        - name: celery-beat
          image: your-dockerhub-username/drfapp:latest
          command: ["celery", "-A", "src", "beat", "--loglevel=info"]
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets