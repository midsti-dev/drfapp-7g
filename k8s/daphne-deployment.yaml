---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: daphne
  namespace: default
  labels:
    app: daphne
spec:
  replicas: 1
  selector:
    matchLabels:
      app: daphne
  template:
    metadata:
      labels:
        app: daphne
    spec:
      containers:
        - name: daphne
          image: your-dockerhub-username/drfapp:latest
          command: ["daphne", "-b", "0.0.0.0", "-p", "8001", "src.asgi:application"]
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets